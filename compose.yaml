services:
  traefik:
    image: docker.io/library/traefik:3
    command:
      - '--api'
      - '--api.insecure=true'
      - '--providers.docker'
      - '--providers.docker.exposedByDefault=false'
      - '--providers.docker.network=web'
      - '--entrypoints.web.address=:80'
    restart: always
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

networks:
  web:
    name: web
